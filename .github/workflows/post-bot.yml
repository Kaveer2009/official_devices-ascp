name: ASCP Poster Bot

on:
  push:
    paths:
      - "device/**/updater/full.json"
      - "device/**/updater/incremental.json"
  workflow_dispatch:

env:
  GitHubMail: "ascpbot128@gmail.com"
  GitHubName: "TheASCPBot"
  GitHubToken: ${{ secrets.GH_TOKEN }}
  BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
  CHAT_ID: ${{ secrets.CHAT_ID }}
  PRIV_CHAT_ID: ${{ secrets.PRIV_CHAT_ID }}

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Dependencies
        run: |
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install pyTelegramBotAPI noobstuffs PyGithub pillow

      - name: Set Git Configs & Secrets
        run: |
          git config --global user.email ${GitHubMail}
          git config --global user.name ${GitHubName}
          git config --global color.ui true
          git config --global credential.helper store
          echo "https://${GitHubName}:${GitHubToken}@github.com" > ~/.git-credentials

      - name: Run ASCPPosterBot
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          source venv/bin/activate
          python3 .github/scripts/post.py

      - name: Commit and Push Changes
        run: |
          git fetch && git pull
          if [ -f commit_mesg.txt ]; then
            COMMIT_MESSAGE=$(cat commit_mesg.txt)
            rm commit_mesg.txt
            git add .github/scripts/file_ids.txt
            git commit -sm "$COMMIT_MESSAGE" || true
            git push origin ${{ github.ref_name }}
          else
            echo "Nothing to commit"
          fi
